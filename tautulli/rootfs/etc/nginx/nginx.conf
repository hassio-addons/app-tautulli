worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stdout info;

events {
    worker_connections 1024;
}

http {
    log_format proxy '$remote_addr "$request_method $uri $server_protocol" $status';
    access_log /dev/stdout proxy;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    map $http_x_ingress_path $external_path {
        default $http_x_ingress_path;
        "" /;
    }

    map $http_x_ingress_path $external_root {
        default "$http_x_ingress_path/";
        "" /;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    server {
        listen 8181;
        absolute_redirect off;
        # %%ACCESS_CONTROL%%
        # %%DIRECT_AUTHENTICATION%%

        location = /api/v2 {
            # %%API_ACCESS_CONTROL%%
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://127.0.0.1:8182/ingress/api/v2;
        }

        location / {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Accept-Encoding "";
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://127.0.0.1:8182/ingress/;
            proxy_redirect ~^(?:https?://[^/]+)?/ingress/(.*)$ $external_root$1;
            proxy_cookie_path /ingress $external_path;
            sub_filter_once off;
            sub_filter_types text/css application/javascript application/json;
            sub_filter /ingress/ $external_root;
        }
    }

}
